# Bind r to source the .tmux.conf
# Let's config changes be reloaded in-place without killing the session
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Set prefix: C-s instead of default C-b
# C-b collides with readline's backward-char binding, so C-s avoids that clash
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Keep more scrollback than the tmux default (2000) for long-running sessions
set -g history-limit 50000

# Start numbering windows/panes at 1, not 0, since 0 is awkward to reach on the keyboard
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers contiguous after closing one, instead of leaving gaps
set -g renumber-windows on

# Remove the default delay after Escape so vim's mode switching feels instant
set -s escape-time 0

# Rename window to its working directory and running command, not just the process name
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^(bash|zsh|fish|sh|dash)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Pane creation and adjustment
# -c "#{pane_current_path}" keeps the new pane in the current pane's working directory
unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Keep new windows in the current pane's working directory too
bind c new-window -c "#{pane_current_path}"

# Pane resizing, from tmux-plugins/tmux-pain-control (uppercase to avoid clashing with h/j/k/l pane navigation below)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-like pane switching
bind -r ^ last-window
bind -r h   select-pane -L
bind -r C-h select-pane -L
bind -r j   select-pane -D
bind -r C-j select-pane -D
bind -r k   select-pane -U
bind -r C-k select-pane -U
bind -r l   select-pane -R
bind -r C-l select-pane -R

# Toggle fullscreen zoom on the active pane
bind -r m resize-pane -Z

# Toggle mouse mode (scroll/click/drag-resize) on and off
# "set -g mouse" with no on/off argument flips the current value;
# current state is shown in status-right below instead of a message
bind M set -g mouse

# Use vi keys in copy mode; the copy-mode-vi bindings below depend on this
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-on
# pbcopy is macOS's clipboard command; copy-pipe-and-cancel also exits copy mode after yanking
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel 'pbcopy'

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# Copy mode selection — Nightfly Selection
set -g mode-style "bg=#244760"

# Show a "Prefix" indicator in the status bar while the prefix key is
# active, and the current mouse mode state (toggled with prefix + M)
# https://stackoverflow.com/questions/12003726/give-a-hint-when-press-prefix-key-in-tmux
set -g status-right ' #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}MouseMode:#{?mouse,on,off} "#{=21:pane_title}"'

## Styling of status line
# Reversed from the original bg/fg: background now carries the state color
# (prefix/pane-mode/mouse/default), inspired by nightfly's orange/purple/blue accents
# but shifted (lighter orange, more saturated purple/blue) so it's not a
# straight reuse of nightfly's exact palette. Foreground reuses nightfly's
# dark bg (#1c2b34) for contrasting text. Green signals mouse mode is on.
set -g status-style "bg=#{?client_prefix,#f0b878,#{?pane_in_mode,#b98eea,#{?mouse,#7fd88f,#6bb0ff}}},fg=#1c2b34"
